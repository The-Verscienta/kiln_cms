# Fly.io config — deploys the published Kiln image (#1529). Fly has no deploy
# button; the steps, costs and caveats are in docs/deploy-platforms.md#fly.
# In short:
#
#   fly launch --from https://github.com/The-Verscienta/kiln_cms --copy-config --no-deploy
#   fly mpg create --pg-major-version 17      # then enable `vector` in its Extensions page
#   fly mpg attach <cluster-id>               # sets DATABASE_URL
#   fly secrets set SECRET_KEY_BASE="$(openssl rand -base64 64 | tr -d '\n')" \
#                   TOKEN_SIGNING_SECRET="$(openssl rand -base64 64 | tr -d '\n')"
#   fly deploy                                # creates the media volume on first run
#
# `fly launch` replaces `app` and `primary_region` with yours.
#
# Upgrading: change the image tag (read that release's `### Upgrading` notes in
# CHANGELOG.md first), then `fly deploy`.

app = "kiln"
primary_region = "iad"

[build]
  image = "ghcr.io/the-verscienta/kiln_cms:0.9.0"

[env]
  PORT = "4000"
  # Uploaded media on the volume below, not in the image (wiped on restart).
  KILN_MEDIA_ROOT = "/app/media"
  # PHX_HOST is not set: Kiln falls back to <FLY_APP_NAME>.fly.dev. Add a
  # custom domain? Set PHX_HOST to it.
  # TRUSTED_PROXIES is not set: Fly documents no proxy address range. See
  # docs/deploy-platforms.md#client-addresses-and-rate-limiting.

[http_service]
  internal_port = 4000
  force_https = true
  # Stay up: scheduled publishing, webhooks and email run in the background
  # job queue, which a stopped machine does not run.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # /up is 200 only once the database answers, and is excluded from force_ssl,
  # so Fly's plain-HTTP probe gets a 200. The grace period covers migrations,
  # which run before the server starts.
  [[http_service.checks]]
    grace_period = "120s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/up"

# One volume per machine: keep this app at a single machine, or move media to
# object storage (S3_BUCKET, e.g. `fly storage create`) before scaling out.
[mounts]
  source = "kiln_media"
  destination = "/app/media"
  initial_size = "1gb"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
