name: Bug report
description: Something in KilnCMS behaves incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. **Do not report security vulnerabilities here** —
        use [private reporting](https://github.com/The-Verscienta/kiln_cms/security)
        instead (see [SECURITY.md](https://github.com/The-Verscienta/kiln_cms/blob/main/.github/SECURITY.md)).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
      placeholder: |
        Expected: publishing a page invalidates the delivery cache.
        Actual: the old body is served for another 60s.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: >
        Numbered steps from a fresh `mix setup` where possible. A failing test or
        an `iex` snippet is even better.
      placeholder: |
        1. `mix setup && mix phx.server`
        2. Sign in at `/sign-in` as `admin@kiln.test`
        3. Create a page, publish it, edit the body, publish again
        4. `curl http://localhost:4000/<slug>` still returns the old body
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the system? Pick the closest match.
      options:
        - Editor UI (LiveView, blocks, TipTap)
        - Content model / Ash resources & policies
        - Delivery & rendering (public site, caching)
        - Headless API (JSON:API, GraphQL, MCP)
        - Auth, RBAC & multi-tenancy
        - Media & asset pipeline
        - Search (Meilisearch, semantic)
        - Forms & submissions
        - Email & webhooks
        - Background jobs (Oban / AshOban)
        - Build, CI, deploy or mix tasks
        - Docs
        - Other / not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: KilnCMS version or commit
      description: Output of `git rev-parse --short HEAD`, or the release tag you're on.
      placeholder: "918ff58d"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >
        Elixir/OTP versions (`elixir -v`), OS, Postgres version, and how you're
        running it (`mix phx.server`, release, Docker). Note any optional infra
        in play (Dragonfly, Meilisearch, MinIO/S3) and whether multi-tenancy is on.
      render: text
      placeholder: |
        Elixir 1.19.3 / OTP 27
        macOS 15.6 / Postgres 16 in Docker
        mix phx.server, single tenant, MinIO storage
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs, stacktrace or screenshots
      description: Paste the relevant server log or browser console output. Redact secrets.
      render: text
    validations:
      required: false
