name: CI

on:
  push:
    branches: [main]
  # No branches filter: stacked PRs (base = another feature branch) must get
  # the same compile/lint/test coverage as PRs into main. A base-branch filter
  # here meant stacked PRs ran zero CI (bit PR #316).
  pull_request:
  # Required for the merge queue. A queued PR is tested on a temporary
  # `gh-readonly-queue/...` ref, which is neither a `push` to main nor a
  # `pull_request` — so without this trigger the required check never starts,
  # every entry sits until it times out, and the queue ejects it. This trigger
  # must be on `main` BEFORE the merge_queue rule is enabled, not after.
  merge_group:

# Cancel superseded runs on the same ref.
#
# Safe for the merge queue: each queued entry gets its own unique
# `gh-readonly-queue/main/pr-<n>-<sha>` ref, so entries never share a group and
# one can't cancel another. Cancelling a merge_group run would fail that entry
# and drop it out of the queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MIX_ENV: test
  # The toolchain is NOT declared here. It lives in .tool-versions, which every
  # setup-beam step reads via `version-file:`. These used to be ELIXIR_VERSION
  # "1.19" / OTP_VERSION "27" — loose, so setup-beam resolved them to whatever
  # was newest and the toolchain CI actually tested drifted on its own, beyond
  # anything the Dockerfile's exact tags could match (#600).

jobs:
  # The main gate is four jobs, not one. It used to be one — compile, every
  # lint, the suite under coverage, then dialyzer, in series — and the last
  # green run before the split measured that job at 17m57s while nothing else
  # in this file took more than five minutes: the coverage run alone was 8m51s
  # (49% of the job), dialyzer 2m02s, `gettext.extract --merge` 1m51s. Every
  # one of those waited on the ones before it for no reason but sharing a
  # runner. So:
  #
  #   build     compile + every lint and static check          (~7 min)
  #   test      the suite, plain, split across N shards        (~4 min each)
  #   coverage  the suite under `mix coveralls.multiple`       (~12 min)
  #   dialyzer  its own job, on the cached PLT                 (~4 min)
  #   ci        `Compile, lint, scan & test` — waits on all four
  #
  # `ci` carries the OLD job's name on purpose: the "Require CI on main"
  # ruleset names exactly that context, so the gate keeps working with no
  # change to repository settings, and it now fails if any of the four does.
  #
  # The `test` shards exist for the fast signal — a red test surfaces at ~4
  # minutes instead of ~12 — not for the total: `coverage` still runs the whole
  # suite, serially, and is now the critical path. Sharding it is the next
  # cut, and it is wiring rather than code: excoveralls has no partition mode,
  # but it honours `mix test --export-coverage NAME` (writes
  # cover/NAME.coverdata) and `--import-cover DIR` (feeds every *.coverdata in
  # DIR to `:cover` before reporting), and only the local/html/cobertura
  # reporters check the floor — so shards can `coveralls.json --export-coverage`
  # without tripping it on partial coverage, and one small job can import the
  # lot under `--exclude test` (zero tests, exit 0) and run the html gate on
  # the union. Verified locally before this landed. When that job exists the
  # coverage shards replace these plain ones. The technique is the one in
  # https://zarar.dev/speeding-up-elixir-test-suites/ — `--partitions` with
  # MIX_TEST_PARTITION naming the database — which config/test.exs has
  # supported since the generator wrote it; every shard gets its own Postgres
  # service besides, so no template-database trick is needed here.
  build:
    name: Compile, lint & scan
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector, not plain postgres: `KilnCMS.Repo.installed_extensions/0`
        # requires the `vector` extension (semantic-search embeddings) even
        # though the feature is disabled by default, so `ash.setup`/`mix test`
        # fail on plain postgres:16 with "extension \"vector\" is not available".
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Elixir/OTP
        uses: erlef/setup-beam@v1
        with:
          # Reads .tool-versions — the single source of truth (#600). Do not
          # restate the versions here; `mix kiln.toolchain.check` guards the
          # two places that genuinely cannot read it (mix.exs, Dockerfile).
          version-file: .tool-versions
          # Required by setup-beam whenever version-file is used: it refuses to
          # guess. Suits us — .tool-versions carries exact versions precisely so
          # the Dockerfile can mirror them.
          version-type: strict

      - name: Cache deps and _build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('.tool-versions') }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ hashFiles('.tool-versions') }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check unused deps are unlocked
        run: mix deps.unlock --check-unused

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Check the toolchain declarations agree
        # .tool-versions is the source of truth, and this job already reads it
        # via setup-beam. The two places that *cannot* read it — mix.exs's
        # `elixir:` requirement and the Dockerfile's ARGs — are guarded here.
        #
        # This is the cheap half of #600 — a declaration check, not a build.
        # The `image` job below is the other half: it builds the release image,
        # so a Dockerfile broken in a way no declaration can express fails on
        # the PR rather than at a deploy.
        run: mix kiln.toolchain.check

      - name: Check every web-layer policy bypass is explained
        # `authorize?: false` skips every Ash policy on the resource. Under
        # lib/kiln_cms_web/ each one must sit next to a comment naming the
        # bypass and saying why it is safe — a system read of display data,
        # a tenant-scoped delivery action whose own filter carries the grant,
        # a pre-auth flow with no actor. #1309: 563 sites in lib/ and no
        # second reviewer had walked them; this keeps a new one from landing
        # by copy-paste alone. Non-web code is not gated yet.
        run: mix kiln.authz.check

      # NOTE (#419): the migration/snapshot drift check moved to the
      # strict_tenancy job — snapshots are generated from the STRICT build
      # (the canonical prod schema: org-composite FKs), which this fail-open
      # test build would mis-diff.

      - name: Check the core ships no downstream project schema
        # Fails if a migrated table or a resource snapshot has no backing Ash
        # resource in a registered domain — i.e. a downstream project's schema
        # leaked into the reusable core. This is what would have caught #288's
        # leftover herbs/formulas tables and the #290 index migrations, both of
        # which the rest of the suite happily passed. Needs the DB, so it leans
        # on the migrations the `test` alias applies.
        run: mix test test/kiln/core_agnostic_test.exs

      - name: Check every content table can answer a search
        # `search_vector` is maintained by a database trigger, not by Ash, so
        # `mix ash.codegen` never generates it and a new content type's table
        # silently ships without one. The type then works right up until
        # somebody searches — and a global search sweeps every registered type,
        # so the whole site's search fails, not just that type's (#295). Runs
        # after the step above so the test database is already migrated.
        run: mix kiln.search.check

      - name: Search containment tests (they lock a shared table)
        # `:table_lock` is excluded from the main run: proving a half-migrated
        # type no longer takes the whole sweep down means dropping
        # `pages.search_vector`, and a pending ACCESS EXCLUSIVE lock queues
        # every other connection's query on that table behind it. Alone, in its
        # own pass, it is harmless.
        run: mix test --only table_lock

      - name: Check the gettext catalogs are up to date
        # `--check-up-to-date` only guards default.pot, so it happily passes
        # while the per-locale .po files rot — which is exactly how fr/es drifted
        # 525 messages behind the source and silently fell back to English.
        # Merging and diffing guards the .po files too, and prints the drift.
        run: |
          mix gettext.extract --merge
          git diff --exit-code -- priv/gettext || {
            echo "::error::Gettext catalogs are out of date. Run 'mix gettext.extract --merge' and commit priv/gettext, translating any new msgids."
            exit 1
          }

      - name: Check the gettext catalogs are actually translated
        # The drift check above only proves the catalogs match the source — it
        # passes just as happily on an empty msgstr (silently renders English)
        # or a bogus fuzzy (renders a *wrong* translation, which is worse).
        # Both shipped past it repeatedly; see the task's moduledoc.
        run: mix kiln.gettext.check

      - name: Check formatting
        run: mix format --check-formatted

      - name: Credo
        run: mix credo --strict

      - name: Sobelow (security scan)
        run: mix sobelow --config

  test:
    name: Test (shard ${{ matrix.partition }})
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector rather than plain postgres — see `build`.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      # Every shard reports. With fail-fast, one red shard cancels the rest
      # and a second failure is found only after fixing the first.
      fail-fast: false
      matrix:
        # The shard count is this list's length and nothing else: the
        # `--partitions` flag below reads it from `strategy.job-total`. To
        # re-shard, add or remove an entry here.
        partition: [1, 2, 3, 4]

    env:
      # `mix test --partitions N` runs the slice this names (1-based), and
      # config/test.exs suffixes the database with it (kiln_cms_test1, …) —
      # the same variable the strict and overlay legs use to stay out of the
      # main database's way. Each shard has its own Postgres service anyway;
      # the suffix is what makes `--partitions` accept the run at all.
      MIX_TEST_PARTITION: ${{ matrix.partition }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Elixir/OTP
        uses: erlef/setup-beam@v1
        with:
          # Reads .tool-versions — the single source of truth (#600); see
          # `build` for why it is strict.
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps and _build
        # Same key as `build`: same MIX_ENV, same profile, so the jobs share
        # one warm cache rather than each warming its own.
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('.tool-versions') }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ hashFiles('.tool-versions') }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        # Plain: `build` is the job that treats warnings as errors.
        run: mix compile

      # The shards install what `coverage` installs (the reasoning is with
      # the steps there) so a shard runs the same test set the coverage run
      # does. Without these, test_helper.exs would exclude :qpdf and :ffmpeg
      # here and run the :no_ffmpeg pair instead, and the two legs would
      # disagree about which tests exist.
      - name: Install qpdf and ffmpeg (metadata stripping tests)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qpdf ffmpeg

      - name: Run this shard of the suite
        # `strategy.job-total` is the matrix's size, so this flag and the
        # MIX_TEST_PARTITION values above cannot drift apart.
        run: mix test --partitions ${{ strategy.job-total }}

  coverage:
    name: Coverage (full suite)
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector rather than plain postgres — see `build`.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Elixir/OTP
        uses: erlef/setup-beam@v1
        with:
          # Reads .tool-versions — the single source of truth (#600); see
          # `build` for why it is strict.
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps and _build
        # Same key as `build` — see the `test` job.
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('.tool-versions') }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ hashFiles('.tool-versions') }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        # Plain: `build` is the job that treats warnings as errors.
        run: mix compile

      # PDF metadata stripping (#807) shells out to qpdf, and the tests that
      # prove an uploaded PDF really loses its /Info and XMP need a real one.
      #
      # The options arrived in qpdf 11.10. Ubuntu 24.04 packages 11.9.0 — one
      # minor short — and 26.04 packages 12.3.2, so whether these tests run
      # depends on where `ubuntu-latest` currently points. `test_helper.exs`
      # excludes the `:qpdf` tag when the installed qpdf can't strip and says
      # so on stderr, so this degrades visibly rather than silently passing.
      # The line below reports it in the job log too, where someone will
      # actually see it. The RELEASE image is Debian trixie (qpdf 12.2.0) and
      # is not affected either way. Whatever this job excludes, the
      # `qpdf_metadata_stripping` job below still runs on a trixie-based
      # container regardless of where `ubuntu-latest` points, so the `:qpdf`
      # tests never go fully dark (#907).
      - name: Install qpdf (PDF metadata stripping tests)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qpdf
          qpdf --version | head -1
          if qpdf --help=all 2>&1 | grep -q -- '--remove-info'; then
            echo "qpdf supports --remove-info; :qpdf tests will run"
          else
            echo "::warning::qpdf $(qpdf --version | head -1) predates 11.10 —" \
                 ":qpdf tests (#807 PDF metadata stripping) will be EXCLUDED"
          fi

      # Same reasoning as qpdf above, for A/V (#820). Without ffmpeg here, the
      # :ffmpeg tests are excluded everywhere that matters and the strip — a
      # privacy control — would be pinned by nothing: a change to the argv that
      # silently stopped removing GPS would merge green. The `:no_ffmpeg` pair
      # is excluded once this is installed, which is the intent; between the
      # two tags, one always runs.
      - name: Install ffmpeg (A/V metadata stripping tests)
        run: |
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      # `mix coveralls.multiple` is `mix test --cover` plus reports (#1314):
      # the JSON one feeds the per-directory rollup below, the HTML one is
      # uploaded as an artifact. The `minimum_coverage` FLOOR in coveralls.json
      # (its comment says what it is and how to move it) is checked by the
      # HTML reporter — excoveralls' JSON reporter never checks it — so
      # `--type html` is the gate, not a nicety, and it is listed AFTER
      # `--type json` on purpose: a floor failure exits inside the html step,
      # and the JSON must already be on disk for the two steps below to run.
      # Cover-compiled modules run slower, so this step takes longer than a
      # bare `mix test` does; that is the price of measuring, paid once per run.
      - name: Run tests (with coverage)
        run: mix coveralls.multiple --type json --type html

      # One row per source directory (lib/kiln_cms_web/live, lib/kiln_cms/
      # firing, …/governance, …) so the editor / delivery / governance split is
      # visible without opening the report; also appended to the job summary.
      # Runs when the report exists even if the step above failed the floor —
      # that is precisely when the breakdown is wanted.
      - name: Coverage by directory
        if: ${{ !cancelled() && hashFiles('cover/excoveralls.json') != '' }}
        run: mix kiln.coverage.summary

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('cover/excoveralls.json') != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: cover/
          retention-days: 14

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest

    # No database: dialyzer reads beam files. `mix dialyzer` compiles the
    # project first (plainly — `build` is the warnings-as-errors leg) and then
    # checks it against the cached PLT, so with a warm cache this is the two
    # minutes the check itself takes plus a compile, in parallel with
    # everything else instead of after it.
    steps:
      - uses: actions/checkout@v5

      - name: Set up Elixir/OTP
        uses: erlef/setup-beam@v1
        with:
          # Reads .tool-versions — the single source of truth (#600); see
          # `build` for why it is strict.
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps and _build
        # Same key as `build` — see the `test` job.
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('.tool-versions') }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ hashFiles('.tool-versions') }}-

      - name: Cache Dialyzer PLTs
        uses: actions/cache@v5
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ hashFiles('.tool-versions') }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-${{ hashFiles('.tool-versions') }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Dialyzer
        run: mix dialyzer

  # The required check. Its name is the one the "Require CI on main" ruleset
  # lists, so splitting the job above into four changed nothing in repository
  # settings — and where the old job could only fail on its own steps, this
  # one fails if ANY of the four does.
  ci:
    name: Compile, lint, scan & test
    runs-on: ubuntu-latest
    needs: [build, test, coverage, dialyzer]
    # `always()` is load-bearing. Without it a failed dependency SKIPS this
    # job, and a skipped required check is not a failed one: the ruleset
    # would sit waiting on a check that will never report, and the merge
    # queue would time the entry out instead of failing it.
    if: ${{ always() }}

    steps:
      - name: Show every job's result
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS"

      # `needs.test.result` is the matrix's combined result, so one red shard
      # is enough. `skipped` is listed although nothing above is conditional
      # today: a future `if:` on one of them must not turn into a silent pass.
      - name: Fail unless every job succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "::error::A required job did not succeed — see the jobs above."
          exit 1

  # Deliberately its own job rather than a step in `build` (#51). The advisory
  # database moves on its own schedule, so this gate can fail on a PR that
  # changed nothing about dependencies. Kept separate, that failure reads as
  # "a new CVE landed" instead of burying the format/credo/sobelow/test results
  # for an unrelated change — the way the in-job gettext gate already does.
  deps_audit:
    name: Dependency audit (mix_audit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Elixir/OTP
        uses: erlef/setup-beam@v1
        with:
          # Reads .tool-versions — the single source of truth (#600). Do not
          # restate the versions here; `mix kiln.toolchain.check` guards the
          # two places that genuinely cannot read it (mix.exs, Dockerfile).
          version-file: .tool-versions
          # Required by setup-beam whenever version-file is used: it refuses to
          # guess. Suits us — .tool-versions carries exact versions precisely so
          # the Dockerfile can mirror them.
          version-type: strict

      - name: Cache deps and _build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-audit-mix-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-audit-mix-${{ hashFiles('.tool-versions') }}-

      # `mix deps.audit` reads mix.lock only — it never compiles the app, so this
      # job needs no database and no asset build.
      - name: Install dependencies
        run: mix deps.get

      # mix_audit clones the advisory database into ~/.local/share at *run* time
      # and discards the exit status of its own git commands
      # (MixAudit.Repo.synchronize/0). If that clone fails — offline runner,
      # GitHub outage — the advisory set is empty and `mix deps.audit` reports
      # "No vulnerabilities found" and exits 0. A gate that silently passes
      # because it checked nothing is worse than no gate, so fetch the database
      # here and fail loudly when it is missing or empty.
      - name: Fetch advisory database
        run: |
          set -euo pipefail
          db="$HOME/.local/share/elixir-security-advisories-mirego"
          git clone --quiet https://github.com/mirego/elixir-security-advisories.git "$db"
          count=$(find "$db/packages" -name '*.yml' | wc -l)
          echo "Advisory database: $count advisories"
          if [ "$count" -eq 0 ]; then
            echo "::error::Advisory database is empty — the audit would pass vacuously."
            exit 1
          fi

      - name: Dependency audit
        run: mix deps.audit

  # Also its own job, for the same reason `deps_audit` is (#53). `mix docs` is
  # the only thing in CI that checks documentation cross-references — a dead
  # link between guides, a renamed `docs/` file still listed in `extras`, a
  # moduledoc naming a function that no longer exists. Those failures should
  # read as "a doc reference broke", not bury the format/credo/sobelow/test
  # results for a change that had nothing to do with docs.
  #
  # This job is also the reason MIX_ENV is overridden below. `ex_doc` is a
  # `:dev`-only dependency, and under `:test` the project compiles
  # `test/support` too, which would publish `DataCase` and the `Stub*` test
  # doubles as part of the API reference. Docs are a dev-profile build.
  docs:
    name: Documentation (mix docs)
    runs-on: ubuntu-latest

    env:
      MIX_ENV: dev

    steps:
      - uses: actions/checkout@v5

      - name: Set up Elixir/OTP
        uses: erlef/setup-beam@v1
        with:
          # Reads .tool-versions — the single source of truth (#600). Do not
          # restate the versions here; `mix kiln.toolchain.check` guards the
          # two places that genuinely cannot read it (mix.exs, Dockerfile).
          version-file: .tool-versions
          # Required by setup-beam whenever version-file is used: it refuses to
          # guess. Suits us — .tool-versions carries exact versions precisely so
          # the Dockerfile can mirror them.
          version-type: strict

      # Own cache: the dev build profile is distinct from the `build` job's
      # test profile (`consolidate_protocols` differs, and esbuild/tailwind are
      # runtime deps only in `:dev`), so sharing that job's key would thrash it.
      - name: Cache deps and _build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-docs-mix-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-docs-mix-${{ hashFiles('.tool-versions') }}-

      - name: Install dependencies
        run: mix deps.get

      # `--warnings-as-errors` is the entire point: without it ExDoc prints
      # broken references and still exits 0.
      - name: Build documentation
        run: mix docs --warnings-as-errors

  client:
    name: Elixir client (kiln_client)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: clients/elixir/kiln_client

    steps:
      - uses: actions/checkout@v5

      - name: Set up Elixir/OTP
        uses: erlef/setup-beam@v1
        with:
          # Reads .tool-versions — the single source of truth (#600). Do not
          # restate the versions here; `mix kiln.toolchain.check` guards the
          # two places that genuinely cannot read it (mix.exs, Dockerfile).
          version-file: .tool-versions
          # Required by setup-beam whenever version-file is used: it refuses to
          # guess. Suits us — .tool-versions carries exact versions precisely so
          # the Dockerfile can mirror them.
          version-type: strict

      - name: Cache deps and _build
        uses: actions/cache@v5
        with:
          path: |
            clients/elixir/kiln_client/deps
            clients/elixir/kiln_client/_build
          key: ${{ runner.os }}-client-mix-${{ hashFiles('.tool-versions') }}-${{ hashFiles('clients/elixir/kiln_client/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-client-mix-${{ hashFiles('.tool-versions') }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test

  e2e:
    name: Browser E2E (Playwright)
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector, not plain postgres: `KilnCMS.Repo.installed_extensions/0`
        # requires the `vector` extension (semantic-search embeddings) even
        # though the feature is disabled by default, so `ash.setup`/`mix test`
        # fail on plain postgres:16 with "extension \"vector\" is not available".
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Elixir/OTP
        uses: erlef/setup-beam@v1
        with:
          # Reads .tool-versions — the single source of truth (#600). Do not
          # restate the versions here; `mix kiln.toolchain.check` guards the
          # two places that genuinely cannot read it (mix.exs, Dockerfile).
          version-file: .tool-versions
          # Required by setup-beam whenever version-file is used: it refuses to
          # guess. Suits us — .tool-versions carries exact versions precisely so
          # the Dockerfile can mirror them.
          version-type: strict

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Cache deps and _build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-e2e-${{ hashFiles('.tool-versions') }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-e2e-${{ hashFiles('.tool-versions') }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          # The browser list is part of the key, not just the lockfile: adding
          # webkit (#1046) while `e2e/package.json` happened to change was luck.
          # Had only the workflow changed, a cache HIT would have restored a
          # chromium-only store, `playwright install` would re-download webkit
          # every run, and the save step would never fire.
          key: ${{ runner.os }}-playwright-chromium-webkit-${{ hashFiles('e2e/package.json') }}

      - name: Install Elixir dependencies
        run: mix deps.get

      - name: Install E2E dependencies + browsers
        working-directory: e2e
        run: |
          npm ci
          # WebKit as well as Chromium: `focus_trap.spec.js` runs on both,
          # because Safari not focusing a `<button>` on click is the case that
          # motivated #1046 and a Chromium-only run leaves it untested. Only
          # that one spec uses it (see the `webkit-focus` project), so this buys
          # a download rather than a doubled suite.
          npx playwright install --with-deps chromium webkit

      # Compile the app in MIX_ENV=e2e up front, as a normal (uncapped) step, so
      # the potentially-cold dep build lands in the cached _build BEFORE
      # Playwright starts. Otherwise this compile runs inside the webServer
      # command below, whose 300s startup budget a cold e2e compile blows.
      - name: Compile app (MIX_ENV=e2e)
        run: MIX_ENV=e2e mix compile

      # Playwright's webServer builds assets, sets up the kiln_cms_e2e DB +
      # demo seeds (mix e2e.setup), then serves (PHX_SERVER=true). With the app
      # already compiled above, startup stays well inside the timeout. See
      # e2e/playwright.config.js.
      - name: Run Playwright suite
        working-directory: e2e
        run: npx playwright test

      # `retries: 1` keeps a single flake from failing the job — but a spec
      # that passes only on retry must be COUNTED, not silently absorbed, or
      # it rots unnoticed until it fails twice in a row (#1353). Playwright's
      # JSON report marks those tests "flaky"; surface the count and names in
      # the job summary on every run, red or green.
      - name: Surface tests that passed only on retry
        if: always()
        working-directory: e2e
        run: |
          report=playwright-report/results.json
          if [ -f "$report" ]; then
            flaky=$(jq '[.. | objects | select(.status? == "flaky")] | length' "$report")
            {
              echo "### Playwright retry report"
              echo "${flaky} test(s) passed only on retry."
              if [ "$flaky" != "0" ]; then
                jq -r '.. | objects | select(.tests? and ([.tests[].status] | index("flaky"))) | "- \(.title)"' "$report"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No Playwright JSON report found (run likely failed before reporting)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # Strict-tenancy smoke (#419): compile fail-closed (KILN_STRICT_TEST=1 is a
  # COMPILE-TIME config in config/test.exs) in its own build dir and run only
  # the @moduletag :strict_tenancy suite — the main suite exercises the
  # fail-open build above.
  strict_tenancy:
    name: Strict-tenancy smoke
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      KILN_STRICT_TEST: "1"
      # MIX_BUILD_ROOT (not MIX_BUILD_PATH): rebar deps (gproc) lose their
      # include paths under a bare BUILD_PATH.
      MIX_BUILD_ROOT: _build_strict
      MIX_TEST_PARTITION: strict

    steps:
      - uses: actions/checkout@v5

      - name: Set up Elixir/OTP
        uses: erlef/setup-beam@v1
        with:
          # Reads .tool-versions — the single source of truth (#600). Do not
          # restate the versions here; `mix kiln.toolchain.check` guards the
          # two places that genuinely cannot read it (mix.exs, Dockerfile).
          version-file: .tool-versions
          # Required by setup-beam whenever version-file is used: it refuses to
          # guess. Suits us — .tool-versions carries exact versions precisely so
          # the Dockerfile can mirror them.
          version-type: strict

      - name: Cache deps and strict build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build_strict
          # v2: the v1 cache holds a half-compiled gproc from before the
          # local.rebar bootstrap step existed.
          key: strict-v2-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}

      - name: Install dependencies
        # local.rebar explicitly: this job has no warm _build cache on first
        # runs and gproc's rebar3 compile failed without the bootstrap.
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Check for migration/snapshot drift (strict build)
        # Snapshots are generated from the strict build — the canonical prod
        # schema (org-composite FKs) — so the drift check lives here (#419).
        # NOTE: this leg sees only the CORE. The overlay_drift job below
        # re-runs the same check with each project overlay activated.
        run: mix ash.codegen --check

      - name: Run the strict smoke suite
        # test_helper includes only :strict_tenancy-tagged tests on this leg.
        run: mix test

  # Overlay drift check (#504): the core drift check above can't see project
  # overlays, so a core migration touching a `KilnCMS.CMS.Content`-macro
  # attribute passes CI while every overlay table misses the new column and
  # the deployed overlay 500s with undefined_column on all its content types.
  # This bit prod twice: #452 → fixed by #459 (seo_keywords) and #488 → fixed
  # by #504 (path_alias), each taking down api.verscienta.com's content API.
  # Activate the overlay exactly the way the Dockerfile does (project.exs +
  # priv merge), then require codegen to be clean.
  overlay_drift:
    name: Overlay drift (example)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Same strict compile as the strict_tenancy job — snapshots diff against
      # the canonical prod schema. Own build root: the overlay's project.exs is
      # compile-time config, so sharing a build dir with the core jobs would
      # poison their caches.
      KILN_STRICT_TEST: "1"
      MIX_BUILD_ROOT: _build_overlay
      MIX_TEST_PARTITION: overlay

    steps:
      - uses: actions/checkout@v5

      - name: Set up Elixir/OTP
        uses: erlef/setup-beam@v1
        with:
          # Reads .tool-versions — the single source of truth (#600). Do not
          # restate the versions here; `mix kiln.toolchain.check` guards the
          # two places that genuinely cannot read it (mix.exs, Dockerfile).
          version-file: .tool-versions
          # Required by setup-beam whenever version-file is used: it refuses to
          # guess. Suits us — .tool-versions carries exact versions precisely so
          # the Dockerfile can mirror them.
          version-type: strict

      - name: Cache deps and overlay build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build_overlay
          key: overlay-v1-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Activate the example overlay
        # Mirrors the Dockerfile's PROJECT=example activation: the
        # subproject's project.exs becomes config/project.exs (compile-time
        # domain registration) and its priv/ (migrations, snapshots) merges
        # into the core priv/ so codegen sees the overlay schema.
        run: |
          cp projects/example/project.exs config/project.exs
          cp -R projects/example/priv/. priv/

      - name: Check for migration/snapshot drift (overlay build)
        run: mix ash.codegen --check

  image:
    name: Release image (build only, ${{ matrix.name }})
    runs-on: ubuntu-latest

    # Two legs: the core image, and one with a project overlay activated (#988).
    #
    # The overlay leg exists because `ARG PROJECT` guards a `RUN if [ -n
    # "$PROJECT" ]` block that the core build never enters — so half the
    # Dockerfile shipped unexercised, in exactly the state #600 exists to close.
    # Its failure mode is the one the Dockerfile's own comment names: the
    # release builds green and boots, then 500s on the first request that
    # touches a project domain.
    #
    # The `overlay_drift` job mirrors the same three steps in Elixir (`cp
    # project.exs`, `cp -R priv/.`) to check schema drift. That proves the
    # activation is *coherent*, not that the Dockerfile's copy of it runs — and
    # the two are the same fact stated twice, so they can drift. This leg is the
    # only thing that executes the Docker one. It also covers `priv/` merging,
    # which nothing on the Elixir side does.
    #
    # Roughly doubles the job's wall time in the worst case and much less in
    # practice: everything up to `COPY projects projects` is byte-identical
    # between the legs, so the second build reads those layers from the shared
    # `type=gha` cache rather than recompiling the dep tree.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            project: ""
          - name: overlay
            project: example

    # The release image is the one artifact nothing else in CI exercises, and
    # the failures it hides are total: #573 raised mix.exs's `elixir:`
    # requirement past the version the Dockerfile pinned, so the builder could
    # not compile the project at all — and every job stayed green for weeks,
    # because none of them builds this image. An earlier revision fetched a
    # signing key with `curl` three lines before installing `curl`. Both were
    # found by reading, which is not a gate (#600).
    #
    # Build only, never push: this proves the image *builds*, which is the
    # failure mode that reaches a deploy. Publishing stays a deliberate act
    # outside CI (prod is a manual Coolify redeploy).
    #
    # NOT a required check, deliberately. The "Require CI on main" ruleset lists
    # only `Compile, lint, scan & test`, so a red build here is visible on the
    # PR but does not block it. That is the right starting position: this job
    # depends on a precompiled NIF downloaded from GitHub at build time (see the
    # flake note below), and a required check that can fail for reasons
    # unrelated to the change blocks every merge until it passes. Promote it by
    # adding the context `Release image (build only)` to that ruleset once its
    # real pass rate and runtime are known.
    #
    # Generous timeout: a cold build compiles the whole dep set, and the
    # Dockerfile deliberately caps the BEAM to 2 schedulers through it to stay
    # inside a small host's RAM. `exla` is dev/test-only, so the XLA build — the
    # one thing that would certainly blow this budget — is not in here.
    #
    # A cold compile is more common than "only when mix.lock changes" would
    # suggest: `COPY mix.exs mix.lock` and `COPY config/config.exs` both precede
    # `mix deps.compile`, so a version bump (every release) or a config edit
    # (often) invalidates the whole dep layer.
    #
    # Known flake vector, worth naming before this is ever made a required
    # check: `tokenizers` pulls a precompiled NIF from GitHub at compile time
    # via `rustler_precompiled`, and the builder has no Rust toolchain to fall
    # back on — so a transient 403 or rate-limit fails the job for reasons that
    # have nothing to do with the change under test.
    timeout-minutes: 60

    env:
      # v6 uploads a build record artifact and writes a job summary on every
      # run. Neither is worth the storage for a build-only check.
      DOCKER_BUILD_SUMMARY: false
      DOCKER_BUILD_RECORD_UPLOAD: false

    steps:
      - uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the release image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # Empty on the core leg, which is exactly the default — so that leg
          # builds the same image it always did, and the overlay leg is the
          # only behaviour change.
          build-args: |
            PROJECT=${{ matrix.project }}
          # Read the cache everywhere, WRITE it only on a push to main.
          #
          # GHA caches are ref-scoped: a PR branch reads main's scope but writes
          # into its own, which nothing but a later push to that same PR will
          # ever read. `mode=max` exports every layer of both stages — the dep
          # tree alone is most of a gigabyte — into a scope that is then dead
          # weight against the repository's shared cache budget, evicting the
          # entries other jobs live on. `priv/plts` is the one that hurts: lose
          # it and `mix dialyzer` rebuilds the PLT from scratch in the `build`
          # job, which reads as an unexplained slow run on an unrelated PR.
          cache-from: type=gha
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}

  # #907: `:qpdf` tests — the ones that prove an uploaded PDF actually loses
  # its `/Info` dictionary and XMP packet (#807) — are excluded from the
  # `build` job above whenever the runner's qpdf predates 11.10 (see the
  # "Install qpdf" step's comment there). `ubuntu-latest` currently packages
  # 11.9.0 — one minor short — so this privacy control has had no CI coverage
  # at all. Rather than move the WHOLE suite onto a newer/untested runner for
  # one feature, this is a small, separate job that runs only the qpdf tests
  # inside `debian:trixie-slim`, the exact base the release image's runner
  # stage already uses successfully (qpdf 12.2.0 there, confirmed in the
  # Dockerfile's own comments).
  #
  # `test/kiln_cms/document_processor_test.exs` is plain `ExUnit.Case,
  # async: true` — no `KilnCMS.DataCase`, no Ecto sandbox — so it never issues
  # a query itself. `mix test` still needs a Postgres service regardless:
  # `test_helper.exs` runs before any test file is even selected, and its
  # `ash.setup`-equivalent database-create step blocks on actually reaching
  # one — confirmed the hard way, with this job failing
  # `The database for KilnCMS.Repo couldn't be created: killed` against no
  # service at all.
  #
  # The hostname differs from `build` above, though: `config/test.exs`
  # defaults to the `POSTGRES_HOST` env var (already used the same way by
  # `config/e2e.exs`), falling back to `"localhost"` — which only reaches a
  # service container on a NON-containerized job. This job's steps run
  # inside `debian:trixie-slim`, where a service is reachable by its service
  # name instead — set below.
  qpdf_metadata_stripping:
    name: PDF metadata stripping (qpdf, Debian trixie)
    runs-on: ubuntu-latest
    container:
      image: debian:trixie-slim

    services:
      postgres:
        # Same image/reasoning as `build`'s service: `pgvector/pgvector:pg16`,
        # not plain postgres, so `ash.setup`/`mix test` don't fail on a
        # missing `vector` extension.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      POSTGRES_HOST: postgres
      # `erlef/setup-beam` picks its precompiled OTP/Elixir build from
      # `ImageOS`, which the runner's own setup scripts normally export — but
      # those scripts never run inside a `container:`, so here it's unset and
      # the action has nothing to match a build against. Debian trixie's
      # glibc is compatible with Ubuntu 24.04's, so `ubuntu24` is the closest
      # of the action's supported targets.
      ImageOS: ubuntu24

    # NOT a required check, same posture and reasoning as `image` above: this
    # is the first time this project has run `erlef/setup-beam` inside a
    # non-Ubuntu container, and a required check that can fail for reasons
    # unrelated to the change under test (a container/action incompatibility,
    # not a qpdf regression) blocks every merge until it's fixed. Promote it
    # by adding the context `PDF metadata stripping (qpdf, Debian trixie)` to
    # the "Require CI on main" ruleset once its real pass rate is known.
    steps:
      # `actions/checkout` needs `git`; qpdf is the thing under test.
      # `ca-certificates` so the later `mix deps.get`/GitHub NIF fetch (for
      # `tokenizers`, the same flake vector `image` above documents) can
      # actually verify TLS. `unzip` isn't in `debian:trixie-slim`, but
      # `erlef/setup-beam` shells out to it to extract the Elixir archive it
      # downloads. `build-essential` (make + a C compiler) is what a hosted
      # runner image ships that a bare container doesn't, and `mix compile`
      # needs it for every NIF dependency in the tree, not just qpdf's own
      # code path — `bcrypt_elixir` is the one that happens to compile first.
      - name: Install git, qpdf, unzip, build-essential and CA certificates
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            git qpdf unzip build-essential ca-certificates
          qpdf --version | head -1
          qpdf --help=all 2>&1 | grep -q -- '--remove-info' || {
            echo "::error::qpdf $(qpdf --version | head -1) still predates 11.10 on" \
                 "debian:trixie-slim — the base image this job relies on has changed."
            exit 1
          }

      - uses: actions/checkout@v5

      - name: Set up Elixir/OTP
        uses: erlef/setup-beam@v1
        with:
          # Reads .tool-versions, same as `build` (#600) — one source of truth.
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps and _build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-trixie-mix-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-trixie-mix-${{ hashFiles('.tool-versions') }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Run the qpdf-tagged tests
        run: mix test test/kiln_cms/document_processor_test.exs --only qpdf
