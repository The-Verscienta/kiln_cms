# Publishes Kiln's security page to the Kiln site that dogfoods it
# (kilncms.dev): the disclosure policy at /security, and a security notice per
# published GitHub security advisory at /security-notices/<ghsa-id>, with its
# feed (#1873). See scripts/publish_security.exs for what is published and
# how, and for the one-time setup (the `security_notice` type and its fields).
#
# Same site and same admin key as the docs, so it reuses their configuration:
#   vars.KILN_DOCS_URL         e.g. https://kilncms.dev — unset skips the job,
#                              so forks and unconfigured clones stay green
#   secrets.KILN_DOCS_API_KEY  :read_write key on an admin account
#
# Publishing an advisory starts no workflow, so this runs on a schedule as
# well: a notice reaches the site within the day without anyone remembering
# to run it. It also runs when SECURITY.md changes on main, and when a release
# is published — a fix ships in a release, and its advisory usually goes out
# the same hour. Publish the advisory first, then the release, and the notice
# goes up with it; otherwise the schedule or a manual run catches it.
name: Publish security page

on:
  push:
    branches: [main]
    paths:
      - .github/SECURITY.md
      - scripts/publish_security.exs
      - scripts/publish/security.exs
      - scripts/publish/common.exs
  release:
    types: [published]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

# One run at a time: two overlapping runs could each create the same new
# notice.
concurrency:
  group: publish-security
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish security page to ${{ vars.KILN_DOCS_URL }}
    if: vars.KILN_DOCS_URL != ''
    runs-on: ubuntu-24.04

    steps:
      # The default branch: SECURITY.md there is the policy in force.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Elixir/OTP
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      # OTP 29.1.1's `:httpc` caps response headers at 10240 bytes, and GitHub's
      # release downloads send more, so a deps-cache miss failed fetching
      # precompiled NIFs (y_ex, lazy_html, vix) and tailwind. Same lift as the
      # Dockerfile; see the escript. Skipped on a checkout that predates it.
      - name: Lift httpc's header limit (OTP 29.1.1)
        run: |
          script="$GITHUB_WORKSPACE/rel/docker/httpc_header_limit.escript"
          if [ -f "$script" ]; then escript "$script"; else echo "::notice::no $script in this checkout; httpc left stock"; fi

      - name: Cache Mix.install
        uses: actions/cache@v5
        with:
          path: ~/.cache/mix/installs
          key: ${{ runner.os }}-publish-security-${{ hashFiles('.tool-versions') }}-${{ hashFiles('scripts/publish_security.exs') }}

      - name: Publish
        env:
          KILN_URL: ${{ vars.KILN_DOCS_URL }}
          KILN_SECURITY_API_KEY: ${{ secrets.KILN_DOCS_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: elixir scripts/publish_security.exs
