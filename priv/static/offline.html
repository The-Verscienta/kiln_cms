<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline</title>
    <link rel="icon" href="/favicon.ico" />
    <!--
      The service worker's offline fallback (issue #65). Precached at install, so
      it must be entirely self-contained: no stylesheet, no script, no image
      request. Inline styles only — the CSP allows `style-src 'unsafe-inline'`
      but locks `script-src` to 'self' with a per-request nonce this static file
      cannot carry.

      Deliberately unbranded: this is a static asset served from `priv/static`,
      so it has no org context. Per-org branding here would mean generating it
      per site — see docs/mobile-admin-spike.md.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafaf9;
        --fg: #1c1b1a;
        --muted: #6b6a68;
        --ember: #cc4e00;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1b1a;
          --fg: #f5f5f4;
          --muted: #a3a29f;
          --ember: #ff7a2f;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem;
        background: var(--bg);
        color: var(--fg);
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.6;
      }
      main {
        max-width: 26rem;
        text-align: center;
      }
      svg {
        width: 3.5rem;
        height: 3.5rem;
        color: var(--ember);
      }
      h1 {
        margin: 1.25rem 0 0.5rem;
        font-size: 1.375rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 0.9375rem;
      }
      a {
        display: inline-block;
        margin-top: 1.75rem;
        padding: 0.625rem 1.25rem;
        border: 1px solid currentColor;
        border-radius: 0.5rem;
        color: var(--ember);
        font-size: 0.9375rem;
        font-weight: 500;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid var(--ember);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M12 3c1.6 3 .4 4.6-.6 5.6-1 1-2.4 2.3-2.4 4.4a3 3 0 0 0 6 0c0-1-.3-1.8-.8-2.5 1.9.9 3.3 2.8 3.3 5.2a5.5 5.5 0 0 1-11 0c0-4.6 3.6-6.2 5.5-12.7Z"
        />
      </svg>
      <h1>You're offline</h1>
      <p>
        This page needs a connection. Your work isn't lost — reconnect and the
        editor picks up where it left off.
      </p>
      <a href="/editor">Try again</a>
    </main>
  </body>
</html>
